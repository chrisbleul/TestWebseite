services:
  - type: web
    name: simplecrm
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

    # Persistente Disk – verhindert Datenverlust bei Redeploys.
    # Erfordert einen kostenpflichtigen Plan (ab ~$0.25/GB/Monat).
    # Zum Aktivieren: auskommentierung entfernen + DB_PATH env var ergänzen.
